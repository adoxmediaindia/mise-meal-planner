services:
  - type: web
    name: mise-backend-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
