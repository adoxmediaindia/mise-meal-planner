<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <defs>
    <radialGradient id="skin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFDFBF"/>
      <stop offset="100%" stop-color="#F2BA8C"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2E18"/>
      <stop offset="100%" stop-color="#2D1A0D"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBECEF"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555E68"/>
      <stop offset="100%" stop-color="#2C3238"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Body / White Chef Coat -->
    <path d="M 100 240 Q 140 215 200 215 Q 260 215 300 240 L 320 370 Q 200 380 80 370 Z" fill="url(#coat)" stroke="#D8DBE0" stroke-width="2"/>
    
    <!-- Coat Collar (Meltto Green trim) -->
    <path d="M 160 216 L 200 245 L 240 216 L 230 205 L 200 212 L 170 205 Z" fill="#9ED034"/>
    <path d="M 165 210 L 200 238 L 235 210" fill="none" stroke="#8BC020" stroke-width="2"/>

    <!-- Coat Front Placket & Buttons -->
    <path d="M 215 235 L 215 370" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Left row buttons -->
    <circle cx="185" cy="265" r="4.5" fill="#2A2A2A"/>
    <circle cx="185" cy="295" r="4.5" fill="#2A2A2A"/>
    <circle cx="185" cy="325" r="4.5" fill="#2A2A2A"/>
    <!-- Right row buttons -->
    <circle cx="215" cy="265" r="4.5" fill="#2A2A2A"/>
    <circle cx="215" cy="295" r="4.5" fill="#2A2A2A"/>
    <circle cx="215" cy="325" r="4.5" fill="#2A2A2A"/>

    <!-- Neck -->
    <rect x="178" y="180" width="44" height="42" rx="10" fill="url(#skin)"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="145" rx="55" ry="62" fill="url(#skin)"/>
    
    <!-- Ears -->
    <ellipse cx="143" cy="148" rx="10" ry="14" fill="#F2BA8C"/>
    <ellipse cx="257" cy="148" rx="10" ry="14" fill="#F2BA8C"/>

    <!-- Hair -->
    <path d="M 145 130 C 140 80, 260 75, 255 130 C 265 110, 260 85, 240 75 C 210 65, 175 65, 155 80 C 142 90, 138 110, 145 130 Z" fill="url(#hair)"/>
    <path d="M 148 115 Q 170 100 205 108 Q 235 98 252 118 Q 235 92 195 90 Q 165 92 148 115 Z" fill="#633F23"/>

    <!-- Eyebrows -->
    <path d="M 166 126 Q 178 121 190 126" fill="none" stroke="#382110" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 210 126 Q 222 121 234 126" fill="none" stroke="#382110" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Eyes (Friendly smiling almond/circles with glint) -->
    <ellipse cx="178" cy="138" rx="6" ry="7" fill="#1F2937"/>
    <circle cx="176" cy="136" r="2" fill="#FFFFFF"/>
    <ellipse cx="222" cy="138" rx="6" ry="7" fill="#1F2937"/>
    <circle cx="220" cy="136" r="2" fill="#FFFFFF"/>

    <!-- Soft blush -->
    <ellipse cx="165" cy="153" rx="8" ry="4" fill="#FF8A80" opacity="0.4"/>
    <ellipse cx="235" cy="153" rx="8" ry="4" fill="#FF8A80" opacity="0.4"/>

    <!-- Nose -->
    <path d="M 197 142 Q 200 154 204 154 Q 207 154 207 150" fill="none" stroke="#D99768" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Mustache & Smile -->
    <path d="M 184 163 Q 200 166 216 163 Q 200 160 184 163 Z" fill="#3D2411"/>
    <path d="M 186 168 Q 200 182 214 168" fill="#FFFFFF" stroke="#3D2411" stroke-width="2.5"/>

    <!-- Arms holding bowl -->
    <!-- Left arm -->
    <path d="M 105 245 Q 115 310 160 330" fill="none" stroke="url(#coat)" stroke-width="28" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M 295 245 Q 285 310 240 330" fill="none" stroke="url(#coat)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Hands -->
    <ellipse cx="152" cy="335" rx="14" ry="12" fill="url(#skin)"/>
    <ellipse cx="248" cy="335" rx="14" ry="12" fill="url(#skin)"/>

    <!-- Salad Bowl (Dark elegant ceramic) -->
    <ellipse cx="200" cy="335" rx="64" ry="14" fill="#24292E"/>
    <path d="M 136 335 Q 145 375 200 375 Q 255 375 264 335 Z" fill="url(#bowl)" stroke="#4A525A" stroke-width="2"/>
    
    <!-- Fresh Salad Ingredients -->
    <!-- Crispy Greens -->
    <ellipse cx="190" cy="330" rx="30" ry="10" fill="#48BB78"/>
    <ellipse cx="215" cy="332" rx="28" ry="9" fill="#38A169"/>
    <circle cx="170" cy="328" r="8" fill="#68D391"/>
    <circle cx="230" cy="328" r="8" fill="#48BB78"/>
    <!-- Ripe Cherry Tomatoes -->
    <circle cx="185" cy="328" r="6" fill="#F56565"/>
    <circle cx="183" cy="326" r="2" fill="#FEB2B2"/>
    <circle cx="216" cy="327" r="6.5" fill="#E53E3E"/>
    <circle cx="214" cy="325" r="2" fill="#FEB2B2"/>
    <!-- Yellow Bell Pepper & Carrot Slaw -->
    <path d="M 195 324 Q 205 326 210 322" stroke="#ECC94B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 175 332 Q 185 335 192 331" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>
    <path d="M 222 331 Q 230 335 236 330" stroke="#ED8936" stroke-width="3" stroke-linecap="round"/>

    <!-- Serving Spoons / Tongs -->
    <path d="M 158 322 L 180 340" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
    <path d="M 242 322 L 220 340" stroke="#CBD5E0" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>